name: Daily Model Training

on:
  schedule:
    - cron: '0 0 * * *'    # Every day at midnight UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write           # Needed to push model back

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aqi_predictor/requirements.txt

      - name: Run training pipeline
        working-directory: aqi_predictor
        run: python training_pipeline.py

      - name: Commit updated model
        working-directory: aqi_predictor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --cached --quiet || git commit -m "chore: daily model retrain [skip ci]"
          git push

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-pipeline-logs
          path: aqi_predictor/logs/
          retention-days: 7
